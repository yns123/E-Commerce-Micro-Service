<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Mağaza</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1>Ürün Yönetimi</h1>
    <div id="message" class="message" hidden></div>

    <h2>Yeni Ürün</h2>
    <form id="create-form" class="form">
      <label>
        Ad
        <input type="text" name="name" required maxlength="200">
      </label>
      <label>
        Açıklama
        <input type="text" name="description" maxlength="2000">
      </label>
      <label>
        Fiyat
        <input type="number" name="price" required min="0.01" step="0.01">
      </label>
      <label>
        Stok
        <input type="number" name="stock" required min="0" step="1">
      </label>
      <label>
        Görsel URL
        <input type="url" name="imageUrl">
      </label>
      <button type="submit" class="btn">Ekle</button>
    </form>

    <h2>Ürünler</h2>
    <div id="content"></div>

    <dialog id="delete-dialog">
      <p>Bu ürünü silmek istediğinize emin misiniz?</p>
      <form method="dialog">
        <button value="cancel" class="btn btn--secondary" type="submit">Vazgeç</button>
        <button value="confirm" class="btn btn--danger" type="submit">Sil</button>
      </form>
    </dialog>
  </main>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
